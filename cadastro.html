<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduControl - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
    <a href="dashboard.html" class="marca">EC EduControl</a>
    <nav>
        <a href="dashboard.html">Início</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="listagem.html">Alunos</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
    </nav>
    <button class="btn-sair" onclick="sair()">Sair</button>
</header>

<main class="container">
    <section class="painel">
        <h1 id="tituloFormulario">Cadastro de alunos</h1>
        <p>Preencha os dados abaixo para cadastrar um aluno.</p>

        <form id="alunoForm">
            <input type="hidden" id="alunoId">

            <label for="nome">Nome completo *</label>
            <input type="text" id="nome" maxlength="100"
                   placeholder="Digite o nome do aluno" required>

            <label for="idade">Idade *</label>
            <input type="number" id="idade" min="1" max="120"
                   placeholder="Digite a idade" required>

            <label for="sexo">Sexo</label>
            <select id="sexo">
                <option value="">Selecione</option>
                <option value="Feminino">Feminino</option>
                <option value="Masculino">Masculino</option>
                <option value="Não informado">Não informado</option>
            </select>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone"
                   placeholder="(11) 99999-9999">

            <label for="email">E-mail *</label>
            <input type="email" id="email"
                   placeholder="aluno@email.com" required>

            <button type="submit" id="botaoSalvar">Salvar aluno</button>
            <button type="reset" class="botao-cinza">Limpar campos</button>
        </form>

        <p id="mensagem"></p>
        <a href="listagem.html" class="link">Consultar alunos cadastrados →</a>
    </section>
</main>

<footer>EduControl © 2026 - Projeto acadêmico</footer>

<script src="script.js"></script>
</body>
</html>
